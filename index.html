<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 반 앱 진열장</title>

<!-- ═══════════════════════════════════════════════════════════════
     ✏️ 선생님이 고칠 곳은 아래 두 칸뿐이에요. (따옴표·쉼표 필요 없음)
     깃허브에서 이 파일(index.html)을 열고 연필(✏️) 버튼 → 고치기 → Commit changes
     ═══════════════════════════════════════════════════════════════ -->

<!-- ✏️ 1. 우리 반 소개 — "항목: 내용" 한 줄씩 -->
<script type="text/plain" id="우리반">
학교: 광남초등학교
학급: 5학년 2반
선생님: 바이브 선생님
한마디: 우리 반이 직접 만들고 함께 쓰는 수업 앱 진열장이에요!
</script>

<!-- ✏️ 2. 앱 목록 — 한 줄에 앱 하나:  이름 | 설명 | 주소 | 서랍 | 그림(이모지)
     · 주소: 같은 저장소에 올린 파일은 파일 이름만(예: weather.html), 다른 곳은 https:// 로 시작하는 주소
     · 서랍: ①~⑦ 중 하나 (모르면 비워 두기)
     · 맨 앞에 # 을 붙이면 그 줄은 숨겨져요 -->
<script type="text/plain" id="앱목록">
광남초 기상 관측소 | 지금 우리 학교 하늘의 기온·습도·기압을 바로 관측해요 | weather.html | ⑤ | 🌤️
우리 반 도우미 | 칭찬 게시판 · 오늘 급식 · AI 영양사 (앱스 스크립트 웹 앱 주소를 넣으세요) | https://script.google.com/ | ④ | 💛
태양계 행성 탐험 도감 | 행성 카드를 누르고 탐험 도장을 모아요 | https://hongdonmax.github.io/fungigame2026/gwangnam/planets.html | ② | 🪐
우리 반 막대그래프 공장 | 조사한 자료를 넣으면 막대그래프가 그려져요 | https://hongdonmax.github.io/fungigame2026/gwangnam/graph.html | ② | 📊
# 숨긴 앱 예시 | 맨 앞에 #이 있으면 진열장에 나오지 않아요 | weather.html | ⑤ | 🙈
</script>
<!-- ═══════════════════ 여기부터는 고치지 않아도 돼요 ═══════════════════ -->

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF7EA;--ink:#2A2730;--muted:#7C7484;--card:#FFFFFF;--line:#F0E2CB;--accent:#F26B3A;
 --d1:#FF8F70;--d2:#3CC8B9;--d3:#FFB830;--d4:#9B8CFF;--d5:#5B9BF0;--d6:#62C26E;--d7:#F2709C;
 --display:'Jua','Gowun Dodum',sans-serif;--body:'Gowun Dodum','Malgun Gothic',sans-serif}
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hero{position:relative;background:linear-gradient(180deg,rgba(255,247,234,0) 45%,rgba(255,247,234,.85) 82%,var(--bg)),url('banner.jpg') center top/cover no-repeat,#FFE3B8;min-height:360px;display:flex;align-items:flex-end}
.hero .wrap{width:100%;display:flex;align-items:flex-end;gap:18px;padding-bottom:18px}
.hero img.ch{width:auto;height:190px;max-width:34vw;object-fit:contain;filter:drop-shadow(0 10px 18px rgba(0,0,0,.25));flex:0 0 auto}
.badge{display:inline-block;background:rgba(255,255,255,.88);border-radius:999px;padding:4px 14px;font-size:14px;color:var(--muted);margin-bottom:8px}
h1{font-family:var(--display);font-size:clamp(30px,6vw,52px);line-height:1.15;margin:0;text-shadow:0 2px 0 #fff,0 0 18px rgba(255,255,255,.9)}
.intro{background:rgba(255,255,255,.9);border-radius:16px;padding:8px 14px;margin-top:10px;display:inline-block;font-size:16px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:20px 0 14px}
.tools h2{font-family:var(--display);font-size:24px;margin:0 auto 0 0}
.btn{font-family:var(--display);font-size:16px;border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:14px;padding:8px 14px;cursor:pointer;text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.btn.main{background:var(--accent);border-color:var(--accent);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--card);border:2px solid var(--line);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s, box-shadow .15s;min-width:0}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(120,80,30,.12)}
.top{height:120px;display:flex;align-items:center;justify-content:center;font-size:62px;background:var(--c);position:relative}
.top .dr{position:absolute;left:12px;top:10px;background:rgba(255,255,255,.92);border-radius:999px;padding:2px 10px;font-family:var(--display);font-size:14px;color:var(--ink)}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.body h3{font-family:var(--display);font-size:21px;margin:0;line-height:1.3}
.body p{margin:0;color:var(--muted);font-size:15px;flex:1}
.acts{display:flex;gap:8px;margin-top:8px}
.acts a{flex:1;justify-content:center}
.empty,.oops{background:#fff;border:2px dashed var(--line);border-radius:20px;padding:24px;text-align:center;color:var(--muted)}
.oops{border-color:#F7A08A;color:#B4472A;margin-bottom:16px;text-align:left}
.how{margin:34px 0 10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.how div{background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 16px;font-size:15px}
.how b{font-family:var(--display);font-size:18px;display:block;color:var(--accent)}
footer{margin:30px 0 40px;color:var(--muted);font-size:14px;text-align:center}
dialog{border:0;border-radius:24px;padding:24px;text-align:center;max-width:min(420px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(42,39,48,.55)}
dialog h3{font-family:var(--display);font-size:22px;margin:0 0 12px}
#qr{display:flex;justify-content:center;margin:8px 0 12px}
#qrUrl{font-size:13px;color:var(--muted);word-break:break-all}
@media (max-width:560px){.hero{min-height:300px}.hero img.ch{height:120px}.hero .wrap{gap:10px}.intro{font-size:15px}}
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <img class="ch" src="character.png" alt="우리 반 캐릭터" onerror="this.style.display='none'">
    <div>
      <span class="badge" id="school">우리 학교</span>
      <h1 id="title">우리 반 앱 진열장</h1>
      <div class="intro" id="intro"></div>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="tools">
    <h2>📚 우리 반 수업 앱</h2>
    <button class="btn" id="qrAll">📱 이 진열장 QR</button>
  </div>
  <div id="oops"></div>
  <div class="grid" id="grid"></div>

  <section class="how">
    <div><b>① 앱 열기</b>카드의 [열기]를 누르면 앱이 새 창으로 열려요.</div>
    <div><b>② QR로 나누기</b>[QR]을 누르면 친구들이 태블릿으로 바로 들어와요.</div>
    <div><b>③ 앱 더하기</b>깃허브에서 index.html의 ✏️ 앱 목록에 한 줄을 더 쓰면 끝!</div>
  </section>
</main>
<footer id="foot">바이브코딩으로 만들고 깃허브로 문을 연 우리 반 진열장</footer>

<dialog id="dlg"><h3 id="qrTitle">QR</h3><div id="qr"></div><div id="qrUrl"></div><p><button class="btn main" onclick="document.getElementById('dlg').close()">닫기</button></p></dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const COLORS = {'①':'var(--d1)','②':'var(--d2)','③':'var(--d3)','④':'var(--d4)','⑤':'var(--d5)','⑥':'var(--d6)','⑦':'var(--d7)'};
const esc = t => String(t || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const text = id => (document.getElementById(id) || {}).textContent || '';

// 1. 우리 반 소개 읽기
const info = {};
text('우리반').split('\n').forEach(line => {
  const i = line.indexOf(':'); if (i < 0) return;
  info[line.slice(0, i).trim()] = line.slice(i + 1).trim();
});
const school = info['학교'] || '우리 학교', cls = info['학급'] || '우리 반';
document.getElementById('school').textContent = school + (info['선생님'] ? ' · ' + info['선생님'] : '');
document.getElementById('title').textContent = cls + ' 앱 진열장';
document.title = school + ' ' + cls + ' 앱 진열장';
document.getElementById('intro').textContent = info['한마디'] || '우리 반이 함께 쓰는 수업 앱을 모았어요.';
document.getElementById('intro').style.display = info['한마디'] === '' ? 'none' : '';

// 2. 앱 목록 읽기
const apps = [], problems = [];
text('앱목록').split('\n').forEach((line, n) => {
  line = line.trim();
  if (!line || line.startsWith('#')) return;
  const p = line.split('|').map(s => s.trim());
  if (p.length < 3 || !p[2]) { problems.push((n) + '번째 줄: "' + line.slice(0, 30) + '…" — | 로 나눈 칸이 3개 이상(이름 | 설명 | 주소) 있어야 해요'); return; }
  apps.push({ name: p[0], desc: p[1], url: p[2], drawer: (p[3] || '').slice(0, 1), icon: p[4] || '✨' });
});
if (problems.length) document.getElementById('oops').innerHTML = '<div class="oops">✏️ 앱 목록에서 고칠 곳이 있어요<br>' + problems.map(esc).join('<br>') + '</div>';

const grid = document.getElementById('grid');
grid.innerHTML = apps.length ? apps.map((a, i) => `
  <article class="card">
    <div class="top" style="--c:${COLORS[a.drawer] || 'var(--d3)'}">${a.drawer ? `<span class="dr">${esc(a.drawer)} 서랍</span>` : ''}${esc(a.icon)}</div>
    <div class="body">
      <h3>${esc(a.name)}</h3>
      <p>${esc(a.desc)}</p>
      <div class="acts"><a class="btn main" href="${esc(a.url)}" target="_blank" rel="noopener">열기 ↗</a><button class="btn" data-qr="${i}">QR</button></div>
    </div>
  </article>`).join('') : '<div class="empty">아직 진열된 앱이 없어요. index.html의 ✏️ 앱 목록에 한 줄을 써 보세요!</div>';

// QR 보여 주기
function full(u) { try { return new URL(u, location.href).href; } catch (e) { return u; } }
function showQR(title, url) {
  document.getElementById('qrTitle').textContent = title;
  const box = document.getElementById('qr'); box.innerHTML = '';
  if (window.QRCode) new QRCode(box, { text: url, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M });
  else box.textContent = 'QR을 만들 수 없어요 (인터넷 연결 확인)';
  document.getElementById('qrUrl').textContent = url;
  document.getElementById('dlg').showModal();
}
grid.addEventListener('click', e => { const b = e.target.closest('[data-qr]'); if (b) { const a = apps[b.dataset.qr]; showQR(a.name, full(a.url)); } });
document.getElementById('qrAll').onclick = () => showQR(document.title, location.href);
</script>
</body>
</html>
